name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - name: Check tag against _meta.lua
        run: |
          version="$(luajit -e 'print(dofile("_meta.lua").version)')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in _meta.lua"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Tests
        run: luajit tests/stats_spec.lua
      - name: Build package
        run: tools/package.sh
      - name: Attach package to the release
        run: gh release upload "$TAG" dist/book_rewind.koplugin.zip dist/book_rewind.koplugin.zip.sha256 --clobber
      - name: Fill empty release notes
        run: |
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi
